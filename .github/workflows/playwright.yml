name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        type: choice
        options: [dev, staging]
        default: dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TEST_ENV: ${{ inputs.environment || 'dev' }}
      CI: true
      # Fall back to public-demo defaults so CI is green out-of-the-box.
      # Override by setting matching repo secrets when pointing at a real app.
      BASE_URL:               ${{ secrets.BASE_URL     || 'https://practice.expandtesting.com' }}
      API_BASE_URL:           ${{ secrets.API_BASE_URL || 'https://jsonplaceholder.typicode.com' }}
      # DB_* are required by the env schema but unused unless RUN_DB_TESTS=1.
      DB_HOST:                ${{ secrets.DB_HOST     || 'localhost' }}
      DB_PORT:                ${{ secrets.DB_PORT     || '5432' }}
      DB_NAME:                ${{ secrets.DB_NAME     || 'testdb' }}
      DB_USER:                ${{ secrets.DB_USER     || 'postgres' }}
      DB_PASSWORD:            ${{ secrets.DB_PASSWORD || 'postgres' }}
      ADMIN_USER_EMAIL:       ${{ secrets.ADMIN_USER_EMAIL       || 'practice' }}
      ADMIN_USER_PASSWORD:    ${{ secrets.ADMIN_USER_PASSWORD    || 'SuperSecretPassword!' }}
      STANDARD_USER_EMAIL:    ${{ secrets.STANDARD_USER_EMAIL    || 'practice' }}
      STANDARD_USER_PASSWORD: ${{ secrets.STANDARD_USER_PASSWORD || 'SuperSecretPassword!' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test
        # To enable sharding later:
        #   1. Add `strategy: { matrix: { shard: [1, 2, 3, 4] } }` at job level
        #   2. Change to: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        #   3. Suffix artifact names with -shard-${{ matrix.shard }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces & test-results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14
